name: fitfast
description: FitFast nutrition and intermittent fasting application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.10.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/fitfast_logo.png
    - assets/icons/fitfast_launcher_foreground.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/fitfast_logo.png"
  adaptive_icon_background: "#1BA58A"
  adaptive_icon_foreground: "assets/icons/fitfast_launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1BA58A"
  web:
    generate: true
    image_path: "assets/icons/fitfast_logo.png"
    background_color: "#E9F8F2"
    theme_color: "#137963"
  windows:
    generate: true
    image_path: "assets/icons/fitfast_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/fitfast_logo.png"
